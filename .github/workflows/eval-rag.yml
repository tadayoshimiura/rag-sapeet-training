name: RAG Evaluation (DeepEval)

on:
  workflow_dispatch: # 手動実行
  schedule:
    - cron: "0 0 * * *" # 毎日深夜0:00 (UTC) に定期実行

jobs:
  evaluate:
    name: Run DeepEval on Bedrock
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # OIDCを使用する場合は role-to-assume を設定してください

      - name: Setup and Run Evaluation
        working-directory: eval_system
        env:
          AWS_BEDROCK_REGION: ap-northeast-1
        run: |
          make setup
          make run

      - name: Upload Report
        if: always() # 失敗してもレポートは見たい
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: eval_system/reports/